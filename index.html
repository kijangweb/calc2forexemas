<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<title>V41 FOREXEMAS - Performance Engine 2026</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root {
  --gold-dark: #6b5200; --gold-mid: #c7a420; --gold-light: #ffe17b;
  --neon-blue: #00f6ff; --neon-dark: #08121b; --warn-red: #ff3e3e;
}
*{box-sizing:border-box; outline: none;}
body{
  margin:0; font-family:'Poppins',Segoe UI,sans-serif;
  display:flex; justify-content:center; align-items:flex-start;
  padding:20px; min-height:100vh; transition: 0.5s;
}
.card{ width:100%; max-width:1150px; border-radius:20px; padding:30px; transition:all 0.5s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

#toast {
  position: fixed; bottom: 25px; right: 25px; padding: 15px 30px;
  background: #238636; color: #fff; border-radius: 12px; font-weight: 800;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(150px);
  transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999;
}
#toast.show { transform: translateY(0); }

nav { display: flex; gap: 12px; margin-bottom: 30px; }
nav button { 
  flex: 1; padding: 16px; border: 2px solid rgba(128,128,128,0.2); border-radius: 12px; 
  cursor: pointer; font-weight: 800; text-transform: uppercase;
  background: transparent; color: inherit; transition: 0.3s; font-size: 11px;
}

body.gold{background:radial-gradient(circle at 40% 20%,#1a1504 0%,#0b0a07 100%);color:#FFFFFF;}
body.gold .card{background:linear-gradient(145deg,#141006,#1a1609,#0b0904);border:2px solid var(--gold-mid);}
body.gold nav button.active{background:var(--gold-mid); color:#000; border-color:transparent;}
body.gold button.primary-btn{background:linear-gradient(135deg,var(--gold-mid),var(--gold-light));color:#000}
body.gold label{color: var(--gold-light);}

body.neon{background:radial-gradient(circle at top,#021220 0%,#000308 100%);color:#FFFFFF;}
body.neon .card{background:linear-gradient(135deg,#081d33,#020910);border:1.8px solid #00f6ff;}
body.neon nav button.active{background:#00f6ff; color:#000; border-color:transparent;}
body.neon button.primary-btn{background:linear-gradient(135deg,#00f6ff,#007bff);color:#fff}
body.neon label{color: #00f6ff;}

.grid-2, .grid-3 { display:grid; gap:20px; margin-bottom:18px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }

.box { display:flex; flex-direction:column; }
label { font-size:11px; margin-bottom:8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
.form-field { padding:14px; border-radius:10px; border:1px solid rgba(128,128,128,0.4); font-size:15px; background: rgba(0,0,0,0.4); color: inherit; width: 100%; outline:none; }

.form-field[readonly] { background: rgba(128,128,128,0.08); border-style: dashed; font-weight: 300; color: #f1f1f1 !important; }

button.primary-btn { padding:16px; border:none; border-radius:12px; cursor:pointer; font-weight:800; width: 100%; transition: 0.3s; font-size: 11px; }

#openWarning { 
    background: rgba(255, 62, 62, 0.2); border: 1px solid var(--warn-red); 
    color: #ff8e8e; padding: 12px; border-radius: 8px; font-size: 11px; 
    font-weight: 700; margin-bottom: 15px; display: none; text-align: center;
}

/* Stats Styling */
.stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
@media (min-width: 600px) { .stats-container { grid-template-columns: repeat(7, 1fr); } }
.stat-item { padding: 12px 5px; border-radius: 12px; background: rgba(255,255,255,0.05); text-align: center; border-bottom: 3px solid rgba(128,128,128,0.3); }
.stat-val { display: block; font-size: 14px; font-weight: 900; margin-top: 5px; }
.stat-label { font-size: 8px; opacity: 0.5; text-transform: uppercase; font-weight: 700; }

#statGrade { font-weight: 900; letter-spacing: 1px; }
.grade-bad { color: #ff3e3e; }
.grade-eval { color: #ffa500; }
.grade-good { color: #00f6ff; }
.grade-excellent { color: #3fb950; }

table { width:100%; border-collapse:collapse; margin-top:20px; font-size:11px; }
th { padding:12px; border-bottom: 2px solid rgba(128,128,128,0.3); opacity: 0.7; text-align: center; }
td { padding:15px 8px; text-align:center; border-bottom:1px solid rgba(128,128,128,0.1); vertical-align: middle; }
.badge { padding:3px 8px; border-radius:4px; font-weight:800; font-size: 9px; }
.bg-buy { background: #238636; color: #fff; }
.bg-sell { background: #da3633; color: #fff; }

.status-profit { color: #3fb950 !important; }
.status-loss { color: #f85149 !important; }
.status-bep { color: #388bfd !important; }
.status-cancel { color: #8b949e !important; }

.btn-state { flex: 1; padding: 12px; font-size: 10px; font-weight: 800; border-radius: 8px; cursor: pointer; border: 1px solid rgba(128,128,128,0.3); background: rgba(128,128,128,0.1); color: inherit; transition: 0.3s; }
.btn-locked { background: #333 !important; color: #666 !important; cursor: not-allowed !important; opacity: 0.6; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
.modal-content { background: #111; width: 300px; border-radius: 16px; border: 1px solid #333; overflow: hidden; }
.modal-content button.menu-opt { display: block; width: 100%; padding: 18px; border: none; background: none; color: white; font-weight: 700; cursor: pointer; border-bottom: 1px solid #222; }
</style>
</head>
<body class="gold">

<div id="toast">Pesan Disalin! 📓</div>

<div class="card">
  <nav>
    <button id="btnTabCalc" class="active">Kalkulator V41</button>
    <button id="btnTabJournal">Database Jurnal</button>
  </nav>

  <div id="sectionCalc">
    <h1>SigCalc V.41</h1>
    <div class="grid-2">
      <div class="box"><label>Theme Style</label><select id="theme" class="form-field"><option value="gold">Gold Luxury</option><option value="neon">Blue Neon</option></select></div>
      <div class="box"><label>Mark Quality</label><select id="starOption" class="form-field"><option value="⭐⭐⭐">⭐⭐⭐ (3 Stars)</option><option value="⭐⭐⭐⭐⭐" selected>⭐⭐⭐⭐⭐ (5 Stars)</option></select></div>
    </div>
    <div class="grid-2">
      <div class="box"><label>Pair Selection</label>
        <select id="pair" class="form-field">
          <optgroup label="Grup 2"><option value="AUDUSD">AUDUSD</option><option value="EURGBP">EURGBP</option><option value="NZDUSD">NZDUSD</option><option value="USDCHF">USDCHF</option></optgroup>
          <optgroup label="Grup 1.5"><option value="AUDJPY">AUDJPY</option><option value="CADJPY">CADJPY</option><option value="EURUSD">EURUSD</option><option value="GBPUSD">GBPUSD</option><option value="NZDJPY">NZDJPY</option><option value="USDCAD">USDCAD</option></optgroup>
          <optgroup label="Grup 1"><option value="CHFJPY">CHFJPY</option><option value="EURJPY">EURJPY</option><option value="EURNZD">EURNZD</option><option value="GBPJPY">GBPJPY</option><option value="USDJPY">USDJPY</option></optgroup>
          <optgroup label="Default"><option value="XAUUSD" selected>XAUUSD</option></optgroup>
        </select>
      </div>
      <div class="box"><label>RRR Multiplier</label><input id="rrr" class="form-field" type="number" step="0.1" value="1"></div>
    </div>
    <div class="grid-2">
      <div class="box"><label>Entry Price</label><input id="op" class="form-field" type="text" value="2641,99"></div>
      <div class="box"><label>Alasan Entry</label><input id="entryReason" class="form-field" type="text" placeholder="EMA 8/13/21 Cross"></div>
    </div>
    <div class="grid-2">
      <div class="box"><label>Stop Loss (SL)</label><input id="slInfo" class="form-field" readonly></div>
      <div class="box"><label>Take Profit (TP)</label><input id="tp" class="form-field" readonly></div>
    </div>
    <div class="grid-2">
      <div class="box"><label>TP Pips Plan</label><input id="tpPips" class="form-field" type="number" value="500"></div>
      <div class="box"><label>Side</label><select id="position" class="form-field"><option value="buy">🟢 BUY</option><option value="sell">🔴 SELL</option></select></div>
    </div>
    <div class="grid-2">
      <div class="box"><label>Duration (Jam)</label><input id="customExpiry" class="form-field" type="number" value="2"></div>
    </div>
    <div style="display:flex; gap:12px; margin-top:20px;">
        <button id="copyOnlyBtn" class="primary-btn" style="background:#333; color:#fff; flex:1">COPY CAPTION</button>
        <button id="saveJournalBtn" class="primary-btn" style="flex:1.2">SIMPAN KE JURNAL</button>
    </div>

    <h3 style="margin-top:40px; font-size:11px; opacity:0.5;">SUMMARY PREVIEW:</h3>
    <table>
      <thead><tr><th>Pair</th><th>Side</th><th>Entry</th><th>SL</th><th>TP</th><th>RRR</th></tr></thead>
      <tbody id="previewBody"></tbody>
    </table>
  </div>

  <div id="sectionJournal" style="display:none;">
    <h1>Jurnal History</h1>
    <div class="filter-container" style="background:rgba(128,128,128,0.1); padding:20px; border-radius:15px; margin-bottom:15px;">
      
      <div id="openWarning">⚠️ ADA POSISI OPEN! SELESAIKAN STATUS SEMUA TRADE HARI INI UNTUK SHARE REPORT.</div>

      <div class="stats-container">
        <div class="stat-item"><span id="statSignal" class="stat-val">0</span><span class="stat-label">Signal</span></div>
        <div class="stat-item"><span id="statProfit" class="stat-val status-profit">0</span><span class="stat-label">Profit</span></div>
        <div class="stat-item"><span id="statLoss" class="stat-val status-loss">0</span><span class="stat-label">Loss</span></div>
        <div class="stat-item"><span id="statWinrate" class="stat-val">0%</span><span class="stat-label">Winrate</span></div>
        <div class="stat-item"><span id="statPF" class="stat-val">0.0</span><span class="stat-label">PF</span></div>
        <div class="stat-item" style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1);"><span id="statGrade" class="stat-val">-</span><span class="stat-label">Quality</span></div>
        <div class="stat-item"><span id="statNet" class="stat-val">0</span><span class="stat-label">Net Pips</span></div>
      </div>

      <div class="grid-3">
        <div class="box"><label>Tgl</label><select id="filterDay" class="form-field" onchange="window.renderJournal()"></select></div>
        <div class="box"><label>Bln</label><select id="filterMonth" class="form-field" onchange="window.updateDayOptions(); window.renderJournal()"><option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option><option value="3">Apr</option><option value="4">Mei</option><option value="5">Jun</option><option value="6">Jul</option><option value="7">Agu</option><option value="8">Sep</option><option value="9">Okt</option><option value="10">Nov</option><option value="11">Des</option></select></div>
        <div class="box"><label>Thn</label><select id="filterYear" class="form-field" onchange="window.renderJournal()"></select></div>
      </div>

      <div class="state-actions">
        <button id="btnShareDaily" class="btn-state" style="background:linear-gradient(135deg,#007bff,#00f6ff); color:#fff; border:none;" onclick="shareDailySummary()">📢 SHARE DAILY REPORT</button>
        <button class="btn-state" onclick="exportData()">💾 EXPORT JSON</button>
        <button class="btn-state" onclick="triggerImport()">📂 IMPORT JSON</button>
        <button class="btn-state" style="background:#da3633; color:#fff; border:none;" onclick="deleteFiltered()">🗑️ RESET</button>
      </div>
      <input type="file" id="importInput" style="display:none" onchange="handleImport(event)">
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Trade ID / Waktu</th><th>Pair / OP</th><th>Side</th><th>Ratio (P/L)</th><th>Kadaluarsa</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody id="journalBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="statusModal" class="modal-overlay">
  <div class="modal-content">
    <button class="menu-opt" onclick="updateStatus('PROFIT')" style="color:#3fb950">WIN / PROFIT</button>
    <button class="menu-opt" onclick="updateStatus('LOSS')" style="color:#f85149">LOSS / CUTLOSS</button>
    <button class="menu-opt" onclick="updateStatus('BEP')" style="color:#388bfd">BEP / SL+</button>
    <button class="menu-opt" onclick="updateStatus('CANCEL')" style="color:#8b949e">CANCEL / EXPIRED</button>
    <button class="menu-opt" onclick="deleteItem()" style="color:#f85149; font-weight:800; border-top:1px solid #333;">HAPUS PERMANEN</button>
    <button class="menu-opt" onclick="closeModal()" style="color:#fff; background:#333">TUTUP</button>
  </div>
</div>

<script>
const BLUEPRINT_DEFAULTS = {
    XAUUSD: { p: 2641.99, pips: 500 }, EURUSD: { p: 1.0850, pips: 300 }, GBPUSD: { p: 1.2650, pips: 300 }, USDJPY: { p: 150.00, pips: 400 }, AUDUSD: { p: 0.6550, pips: 200 }, EURGBP: { p: 0.8550, pips: 200 }, NZDUSD: { p: 0.6150, pips: 200 }, USDCHF: { p: 0.8850, pips: 200 }, AUDJPY: { p: 98.50, pips: 300 }, CADJPY: { p: 110.00, pips: 300 }, NZDJPY: { p: 91.50, pips: 300 }, USDCAD: { p: 1.3550, pips: 300 }, CHFJPY: { p: 170.00, pips: 400 }, EURJPY: { p: 162.50, pips: 400 }, GBPJPY: { p: 190.00, pips: 400 }, EURNZD: { p: 1.7850, pips: 400 }
};

let journal = JSON.parse(localStorage.getItem('v41-master-performance-final')) || [];
let currentId = null;

function formatFullTime(date) {
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()} - ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')} WIB`;
}

function showToast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function getGoldenSuggest(pos, op, slRaw, d) {
    const vOP = parseFloat(op.replace(',', '.'));
    const slClean = slRaw.split(' ')[0].replace(',', '.');
    const vSL = parseFloat(slClean);
    const range = vOP - vSL;
    const s1 = (vSL + (range * 0.3)).toFixed(d).replace('.', ',');
    const s2 = (vSL + (range * 0.7)).toFixed(d).replace('.', ',');
    return (pos === 'BUY') ? `${s1} - ${s2}` : `${s2} - ${s1}`;
}

window.shareDailySummary = function() {
    const btn = document.getElementById('btnShareDaily');
    if(btn.classList.contains('btn-locked')) return alert("Selesaikan trade OPEN.");

    const fD = document.getElementById('filterDay').value, fM = document.getElementById('filterMonth').value, fY = document.getElementById('filterYear').value;
    const filtered = journal.filter(t => {
        const d = new Date(t.rawDate);
        return (d.getDate().toString() === fD) && (d.getMonth().toString() === fM) && (d.getFullYear().toString() === fY);
    });

    if(filtered.length === 0) return alert("Data kosong.");

    const winC = filtered.filter(t => t.status === 'PROFIT').length;
    const lossC = filtered.filter(t => t.status === 'LOSS').length;
    const bepC = filtered.filter(t => t.status === 'BEP').length;
    const canC = filtered.filter(t => t.status === 'CANCEL').length;
    let winP = 0, lossP = 0;
    filtered.forEach(t => {
        if(t.status === 'PROFIT') winP += parseFloat(t.rewardPips);
        if(t.status === 'LOSS') lossP += parseFloat(t.riskPips);
    });

    const net = (winP - lossP).toFixed(1);
    const wr = (winC + lossC + bepC) > 0 ? ((winC / (winC + lossC + bepC)) * 100).toFixed(1) : "0.0";
    const pf = document.getElementById('statPF').innerText;
    const grade = document.getElementById('statGrade').innerText;
    
    const text = `📊 DAILY PERFORMANCE REPORT
Tanggal: ${fD}/${parseInt(fM)+1}/${fY}
-------------------------------
TOTAL SIGNAL  : ${filtered.length} ✅
WIN / PROFIT  : ${winC}
LOSS / RISK   : ${lossC}
BEP / SL+     : ${bepC}
CANCEL/EXPRD  : ${canC}
-------------------------------
NET PIPS      : ${net > 0 ? '+' + net : net}
WIN RATE      : ${wr}%
PROFIT FACTOR : ${pf}
QUALITY       : ${grade}
-------------------------------
DETAIL & MASTER:
https://forexemas.myr.id/support
-------------------------------
Generated by V41 Induk Master`;
    
    navigator.clipboard.writeText(text).then(() => showToast("Detailed Summary Disalin! 📢"));
};

window.copyJournalRow = function(id, manualData = null) {
    const t = manualData || journal.find(item => item.id == id);
    if (!t) return;
    const dec = (t.pair === 'XAUUSD' || t.pair.includes('JPY')) ? 2 : 5;
    const suggest = getGoldenSuggest(t.pos, t.op, t.sl, dec);
    const text = `Trade [${t.tradeId}] ${t.stars}\nPair: ${t.pair} (${t.pos})\nEntry: ${t.op}\nGolden: ${suggest}\nSL: ${t.sl}\nTP: ${t.tp} (+${t.rewardPips} pips)\nRRR: 1:${t.rrr}\nAlasan: ${t.reason || '-'}\n---------------------------------\nTerbit: ${t.dateDisplay}\nExpired: ${t.expiryDisplay}\nHasil: ${t.status}`;
    navigator.clipboard.writeText(text).then(() => showToast("Signal Disalin!"));
};

window.exportData = function() {
    const blob = new Blob([JSON.stringify(journal, null, 2)], { type: "application/json" });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `V41_Blueprint_Backup.json`; a.click();
};

window.triggerImport = function() { document.getElementById('importInput').click(); };
window.handleImport = function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = (ev) => {
        try { journal = JSON.parse(ev.target.result); window.saveAndRender(); showToast("Import Sukses!"); } catch(err) { alert("Format Salah!"); }
    };
    reader.readAsText(file);
};

window.deleteFiltered = function() { if(confirm("Hapus data terfilter?")) { 
    const d = document.getElementById('filterDay').value, m = document.getElementById('filterMonth').value, y = document.getElementById('filterYear').value;
    journal = journal.filter(t => {
        const dt = new Date(t.rawDate);
        return !((dt.getDate().toString() === d) && (dt.getMonth().toString() === m) && (dt.getFullYear().toString() === y));
    });
    window.saveAndRender(); 
}};

window.saveAndRender = function() {
    localStorage.setItem('v41-master-performance-final', JSON.stringify(journal));
    window.renderJournal();
};

window.updateDayOptions = function() {
    const fM = document.getElementById('filterMonth').value, fY = document.getElementById('filterYear').value, selDay = document.getElementById('filterDay');
    const today = new Date();
    const prevVal = selDay.value || today.getDate().toString();
    const year = fY === 'all' ? today.getFullYear() : parseInt(fY);
    const days = new Date(year, parseInt(fM) + 1, 0).getDate();
    let html = '';
    for(let i=1; i<=days; i++) html += `<option value="${i}">${i}</option>`;
    selDay.innerHTML = html;
    if([...selDay.options].some(o => o.value === prevVal)) selDay.value = prevVal;
};

window.renderJournal = function() {
    const fD = document.getElementById('filterDay').value, fM = document.getElementById('filterMonth').value, fY = document.getElementById('filterYear').value;
    const filtered = journal.filter(t => {
        const d = new Date(t.rawDate);
        return (d.getDate().toString() === fD) && (d.getMonth().toString() === fM) && (d.getFullYear().toString() === fY);
    });

    const opens = filtered.filter(t => t.status === 'OPEN');
    document.getElementById('openWarning').style.display = opens.length > 0 ? 'block' : 'none';
    document.getElementById('btnShareDaily').className = opens.length > 0 ? 'btn-state btn-locked' : 'btn-state';

    const wins = filtered.filter(t => t.status === 'PROFIT'), losses = filtered.filter(t => t.status === 'LOSS'), beps = filtered.filter(t => t.status === 'BEP');
    let winP = 0, lossP = 0;
    wins.forEach(w => winP += parseFloat(w.rewardPips));
    losses.forEach(l => lossP += parseFloat(l.riskPips));

    const wrVal = (wins.length + losses.length + beps.length) > 0 ? (wins.length / (wins.length + losses.length + beps.length)) * 100 : 0;
    const pfVal = lossP > 0 ? (winP / lossP) : (winP > 0 ? 99 : 0);

    // LOGIKA QUALITY GRADE
    let grade = "CUKUP", gradeClass = "grade-eval";
    if (filtered.length > 0) {
        if (pfVal < 1.0 || wrVal < 40) { grade = "BURUK"; gradeClass = "grade-bad"; }
        else if (pfVal >= 2.5 || wrVal > 70) { grade = "MANTAP"; gradeClass = "grade-excellent"; }
        else if (pfVal >= 1.5 || wrVal > 55) { grade = "BAIK"; gradeClass = "grade-good"; }
    } else { grade = "-"; }

    document.getElementById('statSignal').textContent = filtered.length;
    document.getElementById('statProfit').textContent = wins.length;
    document.getElementById('statLoss').textContent = losses.length;
    document.getElementById('statWinrate').textContent = wrVal.toFixed(1) + '%';
    document.getElementById('statPF').textContent = pfVal === 99 ? 'MAX' : pfVal.toFixed(2);
    document.getElementById('statNet').textContent = (winP - lossP).toFixed(1);
    const gEl = document.getElementById('statGrade');
    gEl.textContent = grade; gEl.className = 'stat-val ' + gradeClass;

    document.getElementById('journalBody').innerHTML = filtered.map(t => `
        <tr>
            <td><b>${t.tradeId}</b><br><small>${t.dateDisplay}</small></td>
            <td><b>${t.pair}</b><br><small>OP: ${t.op}</small></td>
            <td><span class="badge ${t.pos === 'BUY' ? 'bg-buy' : 'bg-sell'}">${t.pos}</span></td>
            <td><b>1:${t.rrr}</b><br><small>P:+${t.rewardPips}|L:-${t.riskPips}</small></td>
            <td><small>${t.expiryDisplay}</small></td>
            <td class="status-${t.status.toLowerCase()}"><b>${t.status}</b></td>
            <td><button class="btn-action" onclick="copyJournalRow('${t.id}')">📋</button> <button class="btn-action" onclick="openModal('${t.id}')">⚙️</button></td>
        </tr>`).join('');
};

window.openModal = function(id) { currentId = id; document.getElementById('statusModal').style.display = 'flex'; };
window.closeModal = function() { document.getElementById('statusModal').style.display = 'none'; };
window.updateStatus = function(s) {
    journal = journal.map(t => t.id == currentId ? {...t, status: s} : t);
    window.saveAndRender(); window.closeModal();
};
window.deleteItem = function() {
    if(confirm("Hapus trade?")) { journal = journal.filter(t => t.id != currentId); window.saveAndRender(); window.closeModal(); }
};

document.addEventListener('DOMContentLoaded', () => {
    const el = {
        op: document.getElementById('op'), slInfo: document.getElementById('slInfo'), tp: document.getElementById('tp'),
        rrr: document.getElementById('rrr'), tpPips: document.getElementById('tpPips'),
        pair: document.getElementById('pair'), pos: document.getElementById('position'),
        stars: document.getElementById('starOption'), reason: document.getElementById('entryReason'),
        expiry: document.getElementById('customExpiry'), theme: document.getElementById('theme'),
        fDay: document.getElementById('filterDay'), fMonth: document.getElementById('filterMonth'), fYear: document.getElementById('filterYear'),
        btnSave: document.getElementById('saveJournalBtn'), btnCopy: document.getElementById('copyOnlyBtn')
    };

    const today = new Date();
    el.fMonth.value = today.getMonth();
    const yrs = [...new Set([today.getFullYear(), ...journal.map(t => new Date(t.rawDate).getFullYear())])];
    el.fYear.innerHTML = yrs.map(y => `<option value="${y}">${y}</option>`).join('');
    el.fYear.value = today.getFullYear();
    window.updateDayOptions();
    el.fDay.value = today.getDate();

    function updateAll() {
        const p = el.pair.value, pv = p === 'XAUUSD' ? 0.1 : (p.includes('JPY') ? 0.01 : 0.0001), d = (p === 'XAUUSD' || p.includes('JPY')) ? 2 : 5;
        if (el.op.value === "") el.op.value = BLUEPRINT_DEFAULTS[p].p.toFixed(d).replace('.', ',');
        if (el.tpPips.value === "") el.tpPips.value = BLUEPRINT_DEFAULTS[p].pips;
        let vOP = parseFloat(el.op.value.replace(',', '.')) || 0, pips = parseFloat(el.tpPips.value) || 0, mult = parseFloat(el.rrr.value) || 1;
        const riskVal = (pips / mult).toFixed(1), vTP = el.pos.value === 'buy' ? vOP + (pips * pv) : vOP - (pips * pv), vSL = el.pos.value === 'buy' ? vOP - (riskVal * pv) : vOP + (riskVal * pv);
        el.tp.value = vTP.toFixed(d).replace('.', ',');
        el.slInfo.value = `${vSL.toFixed(d).replace('.', ',')} (-${riskVal} pips)`;
        document.getElementById('previewBody').innerHTML = `<tr><td>${p}</td><td>${el.pos.value.toUpperCase()}</td><td>${el.op.value}</td><td>${vSL.toFixed(d).replace('.', ',')}</td><td>${el.tp.value}</td><td>1:${mult}</td></tr>`;
    }

    el.pair.onchange = () => { el.op.value = ""; el.tpPips.value = ""; updateAll(); };
    el.btnCopy.onclick = () => window.copyJournalRow(null, createTrade());
    el.btnSave.onclick = () => {
        const d = createTrade(); journal.unshift(d); window.saveAndRender();
        window.copyJournalRow(d.id); showToast("Sinyal & Jurnal Update!");
    };
    function createTrade() {
        const now = new Date(), exp = new Date(now.getTime() + (el.expiry.value * 3600000));
        return { id: Date.now(), tradeId: "TRX-" + Math.floor(100000 + Math.random()*900000), rawDate: now.toISOString(), dateDisplay: formatFullTime(now), expiryDisplay: formatFullTime(exp), expiryHrs: el.expiry.value, pair: el.pair.value, pos: el.pos.value.toUpperCase(), rrr: el.rrr.value, op: el.op.value, tp: el.tp.value, sl: el.slInfo.value, rewardPips: el.tpPips.value, riskPips: (el.tpPips.value/el.rrr.value).toFixed(1), status: 'OPEN', stars: el.stars.value, reason: el.reason.value };
    }
    document.getElementById('btnTabCalc').onclick = () => { document.getElementById('sectionCalc').style.display='block'; document.getElementById('sectionJournal').style.display='none'; document.getElementById('btnTabCalc').classList.add('active'); document.getElementById('btnTabJournal').classList.remove('active'); };
    document.getElementById('btnTabJournal').onclick = () => { document.getElementById('sectionCalc').style.display='none'; document.getElementById('sectionJournal').style.display='block'; document.getElementById('btnTabJournal').classList.add('active'); document.getElementById('btnTabCalc').classList.remove('active'); window.renderJournal(); };
    el.theme.onchange = () => document.body.className = el.theme.value;
    [el.op, el.tpPips, el.rrr, el.pos, el.expiry].forEach(i => i.oninput = updateAll);
    updateAll();
});
</script>
</body>
</html>
